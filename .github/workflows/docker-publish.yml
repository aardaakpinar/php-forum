name: Publish Docker Image

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    workflow_dispatch:
    schedule:
        # Her pazartesi 03:00 UTC: base image ve Debian güvenlik yamalarıyla yeniden derle
        - cron: "0 3 * * 1"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/php-forum
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Base image'ı her seferinde registry'den çek (eski katmanı kullanma)
                  pull: true
                  # apt-get upgrade katmanını her çalıştırmada yeniden çalıştır
                  build-args: |
                      REFRESH=${{ github.run_id }}
                  # Haftalık zamanlanmış çalışmada cache'i atla ki apt-get upgrade gerçekten çalışsın
                  no-cache: ${{ github.event_name == 'schedule' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
