name: Publish Docker Image

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    workflow_dispatch:
    schedule:
        # Her pazartesi 03:00 UTC: base image ve Debian güvenlik yamalarıyla yeniden derle
        - cron: "0 3 * * 1"

permissions:
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/php-forum
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Base image'ı her seferinde registry'den çek (eski katmanı kullanma)
                  pull: true
                  # apt-get upgrade katmanını her çalıştırmada yeniden çalıştır
                  build-args: |
                      REFRESH=${{ github.run_id }}
                  # Haftalık zamanlanmış çalışmada cache'i atla ki apt-get upgrade gerçekten çalışsın
                  no-cache: ${{ github.event_name == 'schedule' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
